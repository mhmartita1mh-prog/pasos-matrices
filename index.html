<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pasos de Matrices</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(() => console.log('Service Worker registrado'))
          .catch(err => console.error('Error al registrar SW:', err));
      });
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div id="app" class="bg-white shadow-lg rounded-2xl p-6 w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-blue-600 mb-4">Pasos de Matrices</h1>
    <div id="dimensionForm" class="space-y-3">
      <label class="block">Filas: <input id="rows" type="number" min="1" value="2" class="border p-1 w-20 rounded"/></label>
      <label class="block">Columnas: <input id="cols" type="number" min="1" value="2" class="border p-1 w-20 rounded"/></label>
      <button id="createMatrix" class="bg-blue-600 text-white px-3 py-1 rounded">Crear matriz</button>
      <button id="loadSession" class="text-sm text-blue-500 underline">Cargar última sesión</button>
    </div>
    <div id="matrixContainer" class="hidden"></div>
    <div id="actions" class="hidden mt-4 flex gap-2 justify-center">
      <button id="nextBtn" class="bg-green-500 text-white px-4 py-2 rounded">Siguiente</button>
      <button id="finishBtn" class="bg-red-500 text-white px-4 py-2 rounded">Fin</button>
    </div>
    <div id="exportActions" class="hidden mt-4 text-center space-x-3">
      <button id="exportJSON" class="bg-gray-300 px-3 py-1 rounded">Exportar JSON</button>
      <button id="exportCSV" class="bg-gray-300 px-3 py-1 rounded">Exportar CSV</button>
    </div>
  </div>

  <script>
    const matrixContainer = document.getElementById('matrixContainer');
    const actions = document.getElementById('actions');
    const exportActions = document.getElementById('exportActions');
    const dimensionForm = document.getElementById('dimensionForm');

    let matrices = [];
    let rows = 0, cols = 0;

    function createMatrixInputs(r, c) {
      matrixContainer.innerHTML = '';
      const table = document.createElement('table');
      table.className = 'mx-auto';
      for (let i = 0; i < r; i++) {
        const tr = document.createElement('tr');
        for (let j = 0; j < c; j++) {
          const td = document.createElement('td');
          const input = document.createElement('input');
          input.type = 'number';
          input.className = 'border w-16 p-1 m-1 text-center rounded';
          input.value = 0;
          td.appendChild(input);
          tr.appendChild(td);
        }
        table.appendChild(tr);
      }
      matrixContainer.appendChild(table);
    }

    document.getElementById('createMatrix').onclick = () => {
      rows = parseInt(document.getElementById('rows').value);
      cols = parseInt(document.getElementById('cols').value);
      if (rows > 0 && cols > 0) {
        createMatrixInputs(rows, cols);
        matrixContainer.classList.remove('hidden');
        actions.classList.remove('hidden');
        exportActions.classList.remove('hidden');
        dimensionForm.classList.add('hidden');
      }
    };

    document.getElementById('nextBtn').onclick = () => {
      const inputs = matrixContainer.querySelectorAll('input');
      const matrix = [];
      for (let i = 0; i < rows; i++) {
        const row = [];
        for (let j = 0; j < cols; j++) {
          row.push(parseFloat(inputs[i * cols + j].value));
        }
        matrix.push(row);
      }
      matrices.push(matrix);
      localStorage.setItem('matrices', JSON.stringify({ matrices, rows, cols }));
      alert('Matriz guardada. Puedes modificarla para el siguiente paso.');
    };

    document.getElementById('finishBtn').onclick = () => {
      if (confirm('¿Seguro que deseas finalizar y borrar todos los datos?')) {
        matrices = [];
        localStorage.removeItem('matrices');
        matrixContainer.innerHTML = '';
        matrixContainer.classList.add('hidden');
        actions.classList.add('hidden');
        exportActions.classList.add('hidden');
        dimensionForm.classList.remove('hidden');
        alert('Se ha reiniciado la sesión.');
      }
    };

    document.getElementById('exportJSON').onclick = () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(matrices));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = 'matrices.json';
      a.click();
    };

    document.getElementById('exportCSV').onclick = () => {
      let csv = matrices.map((m, idx) => `Paso ${idx+1}\n` + m.map(r => r.join(',')).join('\n')).join('\n\n');
      const dataStr = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = 'matrices.csv';
      a.click();
    };

    document.getElementById('loadSession').onclick = () => {
      const saved = localStorage.getItem('matrices');
      if (saved) {
        const { matrices: m, rows: r, cols: c } = JSON.parse(saved);
        matrices = m;
        rows = r; cols = c;
        createMatrixInputs(rows, cols);
        const inputs = matrixContainer.querySelectorAll('input');
        const last = matrices[matrices.length - 1];
        last.flat().forEach((val, idx) => inputs[idx].value = val);
        matrixContainer.classList.remove('hidden');
        actions.classList.remove('hidden');
        exportActions.classList.remove('hidden');
        dimensionForm.classList.add('hidden');
        alert('Sesión cargada correctamente.');
      } else {
        alert('No hay sesión guardada.');
      }
    };
  </script>
</body>
</html>
